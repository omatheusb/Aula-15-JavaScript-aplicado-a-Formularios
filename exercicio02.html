<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercício 2 - Confirmação de senha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div class="container py-5" style="max-width: 640px;">
  <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">&larr; Voltar</a>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Exercício 2 - Confirmação de senha</h1>
      <p class="text-muted small mb-4">Verifica em tempo real se as senhas são iguais. O botão só é liberado quando batem.</p>
      <form id="form">
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" id="senha" class="form-control">
        </div>
        <div class="mb-3">
          <label for="confirma" class="form-label">Confirmar senha</label>
          <input type="password" id="confirma" class="form-control">
          <div id="feedback" class="form-text"></div>
        </div>
        <button type="submit" id="btnEnviar" class="btn btn-primary" disabled>Cadastrar</button>
      </form>
      <div id="resultado" class="mt-3"></div>
    </div>
  </div>
</div>
<script>
const senha = document.getElementById("senha");
const confirma = document.getElementById("confirma");
const feedback = document.getElementById("feedback");
const btnEnviar = document.getElementById("btnEnviar");

function verificarSenhas() {
  // Enquanto a confirmação estiver vazia, não mostra nada
  if (confirma.value === "") {
    feedback.textContent = "";
    confirma.classList.remove("is-valid", "is-invalid");
    btnEnviar.disabled = true;
    return;
  }

  if (senha.value === confirma.value) {
    feedback.textContent = "As senhas coincidem.";
    feedback.className = "form-text text-success";
    confirma.classList.add("is-valid");
    confirma.classList.remove("is-invalid");
    btnEnviar.disabled = false;
  } else {
    feedback.textContent = "As senhas não coincidem.";
    feedback.className = "form-text text-danger";
    confirma.classList.add("is-invalid");
    confirma.classList.remove("is-valid");
    btnEnviar.disabled = true;
  }
}

// Verifica nos dois campos, pois o usuário pode mudar qualquer um
senha.addEventListener("input", verificarSenhas);
confirma.addEventListener("input", verificarSenhas);

document.getElementById("form").addEventListener("submit", function (e) {
  e.preventDefault();
  document.getElementById("resultado").innerHTML =
    '<div class="alert alert-success">Cadastro realizado!</div>';
});
</script>
</body>
</html>
