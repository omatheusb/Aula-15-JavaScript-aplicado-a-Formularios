<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercício 9 - Selecionar todos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div class="container py-5" style="max-width: 640px;">
  <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">&larr; Voltar</a>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Exercício 9 - Selecionar todos</h1>
      <p class="text-muted small mb-4">Um checkbox mestre marca ou desmarca os outros cinco.</p>
      <form id="form">
        <div class="form-check border-bottom pb-2 mb-2">
          <input class="form-check-input" type="checkbox" id="todos">
          <label class="form-check-label fw-bold" for="todos">Selecionar todos</label>
        </div>
        <div class="form-check"><input class="form-check-input item" type="checkbox" id="i1" value="HTML"><label class="form-check-label" for="i1">HTML</label></div>
        <div class="form-check"><input class="form-check-input item" type="checkbox" id="i2" value="CSS"><label class="form-check-label" for="i2">CSS</label></div>
        <div class="form-check"><input class="form-check-input item" type="checkbox" id="i3" value="JavaScript"><label class="form-check-label" for="i3">JavaScript</label></div>
        <div class="form-check"><input class="form-check-input item" type="checkbox" id="i4" value="Java"><label class="form-check-label" for="i4">Java</label></div>
        <div class="form-check"><input class="form-check-input item" type="checkbox" id="i5" value="SQL"><label class="form-check-label" for="i5">SQL</label></div>
        <button type="submit" class="btn btn-primary mt-3">Enviar</button>
      </form>
      <div id="resultado" class="mt-3"></div>
    </div>
  </div>
</div>
<script>
const todos = document.getElementById("todos");
const itens = document.querySelectorAll(".item");

// Mestre controla todos os itens
todos.addEventListener("change", function () {
  itens.forEach(function (item) {
    item.checked = todos.checked;
  });
});

// Se o usuário marcar/desmarcar um item, atualiza o mestre
itens.forEach(function (item) {
  item.addEventListener("change", function () {
    const marcados = document.querySelectorAll(".item:checked").length;
    todos.checked = marcados === itens.length;
    // "indeterminate" mostra um traço quando só alguns estão marcados
    todos.indeterminate = marcados > 0 && marcados < itens.length;
  });
});

document.getElementById("form").addEventListener("submit", function (e) {
  e.preventDefault();
  const selecionados = [];
  document.querySelectorAll(".item:checked").forEach(function (item) {
    selecionados.push(item.value);
  });
  document.getElementById("resultado").innerHTML =
    '<div class="alert alert-info">Selecionados: ' +
    (selecionados.length ? selecionados.join(", ") : "nenhum") + '</div>';
});
</script>
</body>
</html>
