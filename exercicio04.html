<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercício 4 - Produto em JSON</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div class="container py-5" style="max-width: 640px;">
  <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">&larr; Voltar</a>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Exercício 4 - Produto em JSON</h1>
      <p class="text-muted small mb-4">Monta um objeto com os dados do formulário e mostra em JSON, sem recarregar a página.</p>
      <form id="form">
        <div class="mb-3">
          <label for="nome" class="form-label">Nome do produto</label>
          <input type="text" id="nome" class="form-control" required>
        </div>
        <div class="row">
          <div class="col mb-3">
            <label for="preco" class="form-label">Preço</label>
            <input type="number" id="preco" class="form-control" step="0.01" min="0" required>
          </div>
          <div class="col mb-3">
            <label for="estoque" class="form-label">Estoque</label>
            <input type="number" id="estoque" class="form-control" min="0" required>
          </div>
        </div>
        <div class="mb-3">
          <label for="categoria" class="form-label">Categoria</label>
          <select id="categoria" class="form-select">
            <option>Eletrônicos</option>
            <option>Roupas</option>
            <option>Alimentos</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Gerar JSON</button>
      </form>
      <pre id="saida" class="bg-dark text-light p-3 rounded mt-3 d-none"></pre>
    </div>
  </div>
</div>
<script>
document.getElementById("form").addEventListener("submit", function (e) {
  e.preventDefault(); // não recarrega a página

  // Cria o objeto com os valores digitados
  const produto = {
    nome: document.getElementById("nome").value,
    preco: parseFloat(document.getElementById("preco").value),
    estoque: parseInt(document.getElementById("estoque").value),
    categoria: document.getElementById("categoria").value
  };

  // JSON.stringify converte o objeto em texto JSON (o 2 é a indentação)
  const saida = document.getElementById("saida");
  saida.textContent = JSON.stringify(produto, null, 2);
  saida.classList.remove("d-none");
});
</script>
</body>
</html>
