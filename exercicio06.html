<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercício 6 - Selects dependentes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div class="container py-5" style="max-width: 640px;">
  <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">&larr; Voltar</a>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Exercício 6 - Selects dependentes</h1>
      <p class="text-muted small mb-4">Ao escolher o departamento, a lista de funcionários é preenchida.</p>
      <form id="form">
        <div class="mb-3">
          <label for="departamento" class="form-label">Departamento</label>
          <select id="departamento" class="form-select">
            <option value="">Selecione...</option>
            <option value="ti">TI</option>
            <option value="rh">RH</option>
            <option value="financeiro">Financeiro</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="funcionario" class="form-label">Funcionário</label>
          <select id="funcionario" class="form-select" disabled>
            <option value="">Escolha um departamento primeiro</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Confirmar</button>
      </form>
      <div id="resultado" class="mt-3"></div>
    </div>
  </div>
</div>
<script>
// Cada departamento tem sua lista de funcionários
const funcionarios = {
  ti: ["Ana Souza", "Bruno Lima", "Carlos Mendes"],
  rh: ["Daniela Rocha", "Eduardo Alves"],
  financeiro: ["Fernanda Costa", "Gabriel Martins", "Helena Dias"]
};

const departamento = document.getElementById("departamento");
const funcionario = document.getElementById("funcionario");

departamento.addEventListener("change", function () {
  funcionario.innerHTML = ""; // limpa as opções antigas

  const lista = funcionarios[departamento.value];
  if (!lista) {
    funcionario.innerHTML = '<option value="">Escolha um departamento primeiro</option>';
    funcionario.disabled = true;
    return;
  }

  // Cria uma <option> para cada funcionário
  lista.forEach(function (nome) {
    const opcao = document.createElement("option");
    opcao.value = nome;
    opcao.textContent = nome;
    funcionario.appendChild(opcao);
  });
  funcionario.disabled = false;
});

document.getElementById("form").addEventListener("submit", function (e) {
  e.preventDefault();
  if (!funcionario.value) {
    alert("Selecione um departamento e um funcionário.");
    return;
  }
  document.getElementById("resultado").innerHTML =
    '<div class="alert alert-success">' + funcionario.value + ' (' +
    departamento.options[departamento.selectedIndex].text + ')</div>';
});
</script>
</body>
</html>
