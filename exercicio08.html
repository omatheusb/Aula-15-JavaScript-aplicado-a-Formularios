<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercício 8 - Validação de idade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div class="container py-5" style="max-width: 640px;">
  <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">&larr; Voltar</a>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Exercício 8 - Validação de idade</h1>
      <p class="text-muted small mb-4">Calcula a idade pela data de nascimento e bloqueia o envio para menores de 18 anos.</p>
      <form id="form">
        <label for="nascimento" class="form-label">Data de nascimento</label>
        <input type="date" id="nascimento" class="form-control">
        <div id="feedback" class="form-text"></div>
        <button type="submit" id="btnEnviar" class="btn btn-primary mt-3" disabled>Enviar</button>
      </form>
      <div id="resultado" class="mt-3"></div>
    </div>
  </div>
</div>
<script>
const nascimento = document.getElementById("nascimento");
const feedback = document.getElementById("feedback");
const btnEnviar = document.getElementById("btnEnviar");

function calcularIdade(data) {
  const hoje = new Date();
  const nasc = new Date(data + "T00:00:00");
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const mes = hoje.getMonth() - nasc.getMonth();
  // Se ainda não fez aniversário este ano, tira 1
  if (mes < 0 || (mes === 0 && hoje.getDate() < nasc.getDate())) {
    idade--;
  }
  return idade;
}

nascimento.addEventListener("change", function () {
  if (!nascimento.value) {
    btnEnviar.disabled = true;
    feedback.textContent = "";
    return;
  }

  const idade = calcularIdade(nascimento.value);

  if (idade >= 18) {
    feedback.textContent = "Idade: " + idade + " anos. Liberado.";
    feedback.className = "form-text text-success";
    btnEnviar.disabled = false;
  } else {
    feedback.textContent = "Idade: " + idade + " anos. É preciso ter 18 anos ou mais.";
    feedback.className = "form-text text-danger";
    btnEnviar.disabled = true;
  }
});

document.getElementById("form").addEventListener("submit", function (e) {
  e.preventDefault();
  // Validação de novo no envio, por segurança
  if (calcularIdade(nascimento.value) < 18) return;
  document.getElementById("resultado").innerHTML =
    '<div class="alert alert-success">Cadastro enviado!</div>';
});
</script>
</body>
</html>
