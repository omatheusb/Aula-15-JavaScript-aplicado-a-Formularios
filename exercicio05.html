<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercício 5 - Máscara de telefone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div class="container py-5" style="max-width: 640px;">
  <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">&larr; Voltar</a>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Exercício 5 - Máscara de telefone</h1>
      <p class="text-muted small mb-4">Formata automaticamente no padrão (XX) XXXXX-XXXX e não aceita letras.</p>
      <form id="form">
        <label for="telefone" class="form-label">Telefone</label>
        <input type="text" id="telefone" class="form-control" placeholder="(00) 00000-0000" maxlength="15">
        <div id="erro" class="invalid-feedback">Informe um telefone completo.</div>
        <button type="submit" class="btn btn-primary mt-3">Salvar</button>
      </form>
      <div id="resultado" class="mt-3"></div>
    </div>
  </div>
</div>
<script>
const telefone = document.getElementById("telefone");

telefone.addEventListener("input", function () {
  // Remove tudo que não for número (letras, símbolos)
  let numeros = telefone.value.replace(/\D/g, "");
  numeros = numeros.substring(0, 11); // no máximo 11 dígitos

  // Aplica a máscara aos poucos, conforme a quantidade de dígitos
  let formatado = numeros;
  if (numeros.length > 7) {
    formatado = "(" + numeros.substring(0, 2) + ") " + numeros.substring(2, 7) + "-" + numeros.substring(7);
  } else if (numeros.length > 2) {
    formatado = "(" + numeros.substring(0, 2) + ") " + numeros.substring(2);
  } else if (numeros.length > 0) {
    formatado = "(" + numeros;
  }

  telefone.value = formatado;
});

document.getElementById("form").addEventListener("submit", function (e) {
  e.preventDefault();
  // Regex: confere se está exatamente no formato (XX) XXXXX-XXXX
  const valido = /^\(\d{2}\) \d{5}-\d{4}$/.test(telefone.value);

  if (!valido) {
    telefone.classList.add("is-invalid");
    return;
  }
  telefone.classList.remove("is-invalid");
  document.getElementById("resultado").innerHTML =
    '<div class="alert alert-success">Telefone salvo: ' + telefone.value + '</div>';
});
</script>
</body>
</html>
