<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercício 10 - Dark Mode</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div class="container py-5" style="max-width: 640px;">
  <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">&larr; Voltar</a>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Exercício 10 - Dark Mode</h1>
      <p class="text-muted small mb-4">Alterna a classe do &lt;body&gt; e salva a preferência no localStorage.</p>
      <style>
        body.dark { background-color: #121212 !important; color: #eee; }
        body.dark .card { background-color: #1e1e1e; color: #eee; }
        body.dark .text-muted { color: #aaa !important; }
      </style>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="toggleTema">
        <label class="form-check-label" for="toggleTema">Modo escuro</label>
      </div>
      <p class="mt-3 mb-0">Recarregue a página: o tema escolhido continua salvo.</p>
    </div>
  </div>
</div>
<script>
const toggle = document.getElementById("toggleTema");

// Ao abrir a página, lê a preferência salva
if (localStorage.getItem("tema") === "dark") {
  document.body.classList.add("dark");
  toggle.checked = true;
}

toggle.addEventListener("change", function () {
  // classList.toggle adiciona se não tiver, remove se tiver
  document.body.classList.toggle("dark");

  if (document.body.classList.contains("dark")) {
    localStorage.setItem("tema", "dark");
  } else {
    localStorage.setItem("tema", "light");
  }
});
</script>
</body>
</html>
